name: Build
permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Validate OpenAPI definition
      run: npx -y @redocly/cli lint --config=.redocly.yaml --max-problems=0 snapraidd.yaml
    - name: Lint YAML with yamllint (strict)
      run: |
        pip install yamllint
        yamllint --strict -c .yamllint.yml snapraidd.yaml
    - run: autoreconf -i
    - run: ./configure
    - run: make distcheck
